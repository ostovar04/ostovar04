<svg xmlns="http://www.w3.org/2000/svg" width="820" height="232" viewBox="0 0 820 232" role="img" aria-labelledby="title desc">
<title id="title">Anime-inspired GitHub stats banner for ostovar04</title><desc id="desc">An original chibi programmer with a laptop, colorful manga-style stars, and the GitHub username ostovar04.</desc>
<defs>
 <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#111528"/><stop offset="1" stop-color="#211934"/></linearGradient>
